image: eclipse-temurin:21-jdk

stages:
  - build
  - upload
  - share

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

  RCLONE_REMOTE: "MebahelModding"
  RCLONE_DEST_PATH: "ModsBuilds"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .gradle/wrapper
    - .gradle/caches

# ---------------------------
# 1) BUILD DU MOD
# ---------------------------
build_mod:
  stage: build
  script:
    - chmod +x ./gradlew
    - ./gradlew clean build
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 week
  only:
    - "1.20"

# ---------------------------
# 2) UPLOAD VERS GOOGLE DRIVE
#    + SAUVEGARDE DE L'ID DU FICHIER
# ---------------------------
upload_to_drive:
  stage: upload
  needs:
    - build_mod
  image: alpine:latest

  before_script:
    - apk add --no-cache curl unzip grep coreutils
    # Installer rclone
    - curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
    - unzip rclone-current-linux-amd64.zip
    - cp rclone-*-linux-amd64/rclone /usr/bin/
    # Config rclone
    - mkdir -p "$HOME/.config/rclone"
    - echo "$RCLONE_CONF_BASE64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
    - rclone config file

  script:
    - echo "Liste des fichiers dans build/libs"
    - ls -R build/libs || true

    # On prend le premier .jar non "-sources"
    - JAR=$(ls build/libs/*.jar | grep -v 'sources' | head -n 1 || true)
    - if [ -z "$JAR" ]; then echo "Aucun jar valide trouve"; exit 1; fi

    - echo "Jar selectionne $JAR"
    - BASENAME=$(basename "$JAR")
    - echo "Basename $BASENAME"

    # Upload du jar vers Drive
    - echo "=== Upload Drive ==="
    - rclone copy "$JAR" "$RCLONE_REMOTE:$RCLONE_DEST_PATH/" -v

    # Récupérer la liste JSON des fichiers dans le dossier de destination
    - echo "=== rclone lsjson sur $RCLONE_REMOTE:$RCLONE_DEST_PATH ==="
    - JSON=$(rclone lsjson "$RCLONE_REMOTE:$RCLONE_DEST_PATH" --files-only)
    - echo "$JSON"

    # Extraire l'ID du fichier correspondant à notre JAR (même nom)
    - FILE_ID=$(echo "$JSON" | tr -d '\n' | sed -E "s/.*\"Path\":\"$BASENAME\"[^\}]*\"ID\":\"([^\"]*)\".*/\1/")
    - echo "FILE_ID=$FILE_ID"
    - if [ -z "$FILE_ID" ]; then echo "Impossible de recuperer le fileId pour $BASENAME"; exit 1; fi

    # Sauvegarder l'ID pour le job suivant
    - echo "$FILE_ID" > drive_file_id.txt

  artifacts:
    paths:
      - drive_file_id.txt
    expire_in: 1 week

  only:
    - "1.20"

# ---------------------------
# 3) PARTAGE DRIVE A PARTIR
#    DE google_drive_share_list.txt
# ---------------------------
share_on_drive:
  stage: share
  needs:
    - upload_to_drive
  image: alpine:latest

  before_script:
    - apk add --no-cache curl grep coreutils
    - mkdir -p "$HOME/.config/rclone"
    - echo "$RCLONE_CONF_BASE64" | base64 -d > "$HOME/.config/rclone/rclone.conf"

  script:
    - echo "CWD = $(pwd)"
    - echo "Contenu du repo :"
    - ls -al .

    - FILE_ID=$(cat drive_file_id.txt)
    - echo "FILE_ID=$FILE_ID"
    - if [ -z "$FILE_ID" ]; then echo "FILE_ID manquant"; exit 1; fi

    # Récupérer token rclone
    - TOKEN_JSON=$(grep '^token =' "$HOME/.config/rclone/rclone.conf" | sed 's/token = //')
    - ACCESS_TOKEN=$(echo "$TOKEN_JSON" | sed -E 's/.*"access_token":"([^"]+)".*/\1/')
    - echo "Access token recupere (tronque) ${ACCESS_TOKEN:0:10}..."
    - if [ -z "$ACCESS_TOKEN" ]; then echo "Impossible de recuperer l access_token"; exit 1; fi

    # Vérifier que le fichier de liste existe bien ici
    - if [ ! -f google_drive_share_list.txt ]; then echo "google_drive_share_list.txt introuvable ICI"; exit 1; fi

    - echo "=== Contenu de google_drive_share_list.txt ==="
    - cat google_drive_share_list.txt

    # Boucle : un email par ligne, ignore vides et commentaires
    - |
      while IFS= read -r EMAIL; do [ -z "$EMAIL" ] && continue; case "$EMAIL" in \#*) continue;; esac; echo "Ajout de $EMAIL comme editeur..."; curl -s -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" -d "{\"role\":\"writer\",\"type\":\"user\",\"emailAddress\":\"$EMAIL\"}" "https://www.googleapis.com/drive/v3/files/$FILE_ID/permissions" | tee -a curl_permissions.log; done < google_drive_share_list.txt

    - echo "=== Reponse Drive permissions ==="
    - cat curl_permissions.log || true


  only:
    - "1.20"
