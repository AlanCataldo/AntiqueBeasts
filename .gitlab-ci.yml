image: eclipse-temurin:21-jdk

stages:
  - build
  - upload

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

  RCLONE_REMOTE: "MebahelModding"
  RCLONE_DEST_PATH: "ModsBuilds"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .gradle/wrapper
    - .gradle/caches

# ---------------------------
# 1) BUILD DU MOD
# ---------------------------
build_mod:
  stage: build
  script:
    - chmod +x ./gradlew
    - ./gradlew clean build
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 week
  only:
    - "1.20"

# ---------------------------
# 2) UPLOAD VERS GOOGLE DRIVE
# ---------------------------
upload_to_google_drive:
  stage: upload
  needs:
    - build_mod
  image: alpine:latest

  before_script:
    # 1) Installer ce qu'il faut
    - apk add --no-cache curl unzip grep coreutils

    # 2) Installer rclone
    - curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
    - unzip rclone-current-linux-amd64.zip
    - cp rclone-*-linux-amd64/rclone /usr/bin/

    # 3) Créer le dossier de config dans le HOME VRAI du container
    - echo "HOME=$HOME"
    - mkdir -p "$HOME/.config/rclone"

    # 4) Reconstruire rclone.conf depuis la variable base64
    - echo "$RCLONE_CONF_BASE64" | base64 -d > "$HOME/.config/rclone/rclone.conf"

    # 5) Debug : voir le fichier que rclone pense utiliser + les remotes
    - rclone config file
    - echo "=== Contenu de rclone.conf ==="
    - cat "$HOME/.config/rclone/rclone.conf" || echo "rclone.conf introuvable"
    - echo "=== Remotes detectes par rclone ==="
    - rclone listremotes || echo "Aucun remote detecte"

script:
  - echo "Liste des fichiers dans build/libs"
  - ls -R build/libs || true

  # Trouver le bon jar (pas le sources)
  - JAR=$(ls build/libs/*.jar | grep -v 'sources' | head -n 1 || true)
  - if [ -z "$JAR" ]; then echo "Aucun jar valide trouve"; exit 1; fi

  - echo "Jar selectionne $JAR"

  # Upload vers Google Drive + récupérer metadata JSON (dont fileId)
  - echo "=== Upload Drive ==="
  - UPLOAD_JSON=$(rclone copy "$JAR" "$RCLONE_REMOTE:$RCLONE_DEST_PATH/" --drive-upload-cutoff=0 --dump bodies 2>&1 | tee upload.log)

  # Extraire fileId Google Drive depuis le JSON envoyé par l’API
  - FILE_ID=$(grep -oP '"id":\s*"\K[^"]+' upload.log | head -n 1)
  - echo "FILE_ID=$FILE_ID"

  - if [ -z "$FILE_ID" ]; then echo "Impossible de récupérer le fileId"; exit 1; fi

  # Ajouter la permission lecteur pour l'email demandé
  - echo "=== Ajout permission pour jamesharris1703@gmail.com ==="
  - curl -s -X POST \
      -H "Authorization: Bearer $GDRIVE_ACCESS_TOKEN" \
      -H "Content-Type: application/json" \
      -d '{"role":"reader","type":"user","emailAddress":"jamesharris1703@gmail.com"}' \
      "https://www.googleapis.com/drive/v3/files/$FILE_ID/permissions"

  - echo "=== Partage Drive OK ==="

  only:
    - "1.20"